<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ejercicio Display y Cajas</title>
<style>
 
  a {
    display: block;
    background-color: black;
    color: white;
    padding: 10px;
    margin-bottom: 2px;
    text-decoration: none;
  }

  img {
    display: block;
    border: 5px solid red;
    margin: 10px auto;
  }

  span {
    display: inline-block;
    border: 1px dotted black;
    padding: 5px 10px;
    margin-right: 5px;
  }
</style>
</head>
<body>

 
  <a href="#">Link</a>
  <a href="#">Link</a>
  <a href="#">Link</a>
  <a href="#">Link</a>

  
  <img src="solucion.png" alt="Imagen central">
  <img src="solucion.png" alt="Imagen central">
  <img src="solucion.png" alt="Imagen central">
  <img src="solucion.png" alt="Imagen central">

  
  <div>
    <span>Coffee</span>
    <span>Tea</span>
    <span>Coca Cola</span>
  </div>

</body>
</html>
